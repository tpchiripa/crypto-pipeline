version: "3.8"

# Shared build config for our three Python services (producer, normalizer, api) -
# they all use the same Dockerfile/context, so define it once and reuse it.
x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

services:
  # Redpanda = Kafka-API-compatible broker, much lighter to run locally.
  # Anything you write against this works against real Kafka / GCP Pub/Sub-Kafka later.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"   # admin/metrics API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Web UI to see topics/messages flowing - useful while learning
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.1
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: ${KAFKA_BOOTSTRAP}
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: crypto-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      # NOTE: must check the actual DB name, not just the user -
      # pg_isready defaults to a database matching the username otherwise,
      # which doesn't exist here and makes the healthcheck fail forever.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The connector: pulls from Binance WebSocket, publishes raw events to Kafka
  producer:
    <<: *app-build
    container_name: crypto-producer
    command: python -m connectors.crypto_binance
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "9101:9100"   # /metrics for Prometheus
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW}
      BINANCE_SYMBOLS: ${BINANCE_SYMBOLS}
      METRICS_PORT: 9100

  # Second connector: proves the platform is genuinely modular, not just
  # crypto-specific. Polls multiple RSS feeds instead of streaming a
  # WebSocket - structurally a very different source, same BaseConnector
  # interface, and now genuinely global rather than one narrow query.
  news-producer:
    <<: *app-build
    container_name: crypto-news-producer
    command: python -m connectors.news_rss
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "9102:9100"   # /metrics for Prometheus
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_TOPIC_RAW: ${NEWS_TOPIC_RAW}
      NEWS_FEEDS: ${NEWS_FEEDS}
      NEWS_POLL_INTERVAL: ${NEWS_POLL_INTERVAL}
      METRICS_PORT: 9100

  # Third connector: proves a completely different ingestion pattern -
  # batch file drops instead of a live API. Watches a real folder on YOUR
  # machine (bind-mounted below), so dropping a CSV into data/incoming
  # gets picked up and ingested automatically, just like a hotel PMS or
  # POS export landing in a folder for a real pipeline to pick up.
  retail-producer:
    <<: *app-build
    container_name: crypto-retail-producer
    command: python -m connectors.retail_csv
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "9104:9100"   # /metrics for Prometheus
    volumes:
      - ./data/incoming:/app/data/incoming
      - ./data/processed:/app/data/processed
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_TOPIC_RAW: ${RETAIL_TOPIC_RAW}
      RETAIL_WATCH_DIR: /app/data/incoming
      RETAIL_PROCESSED_DIR: /app/data/processed
      RETAIL_POLL_INTERVAL: ${RETAIL_POLL_INTERVAL}
      METRICS_PORT: 9100

  # Fourth connector: financial reconciliation. Watches for CSV exports
  # from ANY accounting/POS/ordering system (Dyner, Lightspeed, Xero, or
  # anything else) and stages them for GL account crosswalk mapping - the
  # normalizer resolves each system's native category to one canonical
  # chart-of-accounts entry.
  gl-producer:
    <<: *app-build
    container_name: crypto-gl-producer
    command: python -m connectors.gl_import
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "9105:9100"   # /metrics for Prometheus
    volumes:
      - ./data/gl_incoming:/app/data/gl_incoming
      - ./data/gl_processed:/app/data/gl_processed
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_TOPIC_RAW: ${GL_TOPIC_RAW}
      GL_WATCH_DIR: /app/data/gl_incoming
      GL_PROCESSED_DIR: /app/data/gl_processed
      GL_POLL_INTERVAL: ${GL_POLL_INTERVAL}
      METRICS_PORT: 9100

  # Fifth connector: hospitality inventory. Same file-drop pattern as
  # retail, but the real value is in the normalizer - standardizing units
  # across suppliers who invoice in kg, lbs, gallons, or "each" so
  # ingredient totals are actually comparable.
  hospitality-producer:
    <<: *app-build
    container_name: crypto-hospitality-producer
    command: python -m connectors.hospitality_csv
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "9106:9100"   # /metrics for Prometheus
    volumes:
      - ./data/hospitality_incoming:/app/data/hospitality_incoming
      - ./data/hospitality_processed:/app/data/hospitality_processed
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_TOPIC_RAW: ${HOSPITALITY_TOPIC_RAW}
      HOSPITALITY_WATCH_DIR: /app/data/hospitality_incoming
      HOSPITALITY_PROCESSED_DIR: /app/data/hospitality_processed
      HOSPITALITY_POLL_INTERVAL: ${HOSPITALITY_POLL_INTERVAL}
      METRICS_PORT: 9100

  # The normalizer: consumes raw events from ALL FIVE source topics,
  # cleans/validates per-source, writes to Postgres. One normalizer, many
  # sources - this is the piece that proves adding a source doesn't mean
  # adding a whole new processing pipeline.
  normalizer:
    <<: *app-build
    container_name: crypto-normalizer
    command: python -m processor.normalizer
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "9103:9100"   # /metrics for Prometheus
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_TOPICS_RAW: ${KAFKA_TOPIC_RAW},${NEWS_TOPIC_RAW},${RETAIL_TOPIC_RAW},${GL_TOPIC_RAW},${HOSPITALITY_TOPIC_RAW}
      KAFKA_GROUP_ID: normalizer-main
      DATABASE_URL: ${DATABASE_URL}
      METRICS_PORT: 9100

  # The API layer: lets any other software query normalized data
  api:
    <<: *app-build
    container_name: crypto-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}

  # React frontend: live ticker, price chart, trade feed - consumes the API
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto-frontend
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE: http://localhost:8000
    restart: unless-stopped

  # Scrapes /metrics from every Python service every 5s and stores it as
  # time series data. This is the piece that turns "it logged something"
  # into "I can query and graph pipeline health over time."
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: crypto-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Dashboards on top of Prometheus. Datasource and the pipeline dashboard
  # are both auto-provisioned on startup - no manual clicking required.
  grafana:
    image: grafana/grafana:11.1.0
    container_name: crypto-grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  redpanda-data:
  pg-data:
  prometheus-data:
  grafana-data:
