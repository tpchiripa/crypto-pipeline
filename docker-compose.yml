version: "3.8"

# Shared build config for our three Python services (producer, normalizer, api) -
# they all use the same Dockerfile/context, so define it once and reuse it.
x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

services:
  # Redpanda = Kafka-API-compatible broker, much lighter to run locally.
  # Anything you write against this works against real Kafka / GCP Pub/Sub-Kafka later.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"   # admin/metrics API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Web UI to see topics/messages flowing - useful while learning
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.1
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: ${KAFKA_BOOTSTRAP}
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: crypto-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      # NOTE: must check the actual DB name, not just the user -
      # pg_isready defaults to a database matching the username otherwise,
      # which doesn't exist here and makes the healthcheck fail forever.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The connector: pulls from Binance WebSocket, publishes raw events to Kafka
  producer:
    <<: *app-build
    container_name: crypto-producer
    command: python -m connectors.crypto_binance
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW}
      BINANCE_SYMBOLS: ${BINANCE_SYMBOLS}

  # Second connector: proves the platform is genuinely modular, not just
  # crypto-specific. Polls an RSS feed instead of streaming a WebSocket -
  # structurally a very different source, same BaseConnector interface.
  news-producer:
    <<: *app-build
    container_name: crypto-news-producer
    command: python -m connectors.news_rss
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_TOPIC_RAW: ${NEWS_TOPIC_RAW}
      NEWS_FEED_URL: ${NEWS_FEED_URL}
      NEWS_POLL_INTERVAL: ${NEWS_POLL_INTERVAL}

  # The normalizer: consumes raw events from BOTH source topics, cleans/
  # validates per-source, writes to Postgres. One normalizer, many sources -
  # this is the piece that proves adding a source doesn't mean adding a
  # whole new processing pipeline.
  normalizer:
    <<: *app-build
    container_name: crypto-normalizer
    command: python -m processor.normalizer
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_TOPICS_RAW: ${KAFKA_TOPIC_RAW},${NEWS_TOPIC_RAW}
      KAFKA_GROUP_ID: normalizer-main
      DATABASE_URL: ${DATABASE_URL}

  # The API layer: lets any other software query normalized data
  api:
    <<: *app-build
    container_name: crypto-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}

  # React frontend: live ticker, price chart, trade feed - consumes the API
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto-frontend
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE: http://localhost:8000
    restart: unless-stopped

volumes:
  redpanda-data:
  pg-data:
